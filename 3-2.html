<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>302 zhy</title>
    <style>
        p{
            color: #94a;
            font-size:50px;
        }
        #box{
            width: 600px;
            height: 500px;
            background-color: blue;
        }
        /* 扩展2：h2黑底白字 */
        h2{
            background-color: black;
            color: white;
        }
        /* 扩展3：“选择器”三个字白色 */
        .sel-text{
            color: #ffffff;
        }
        /* 扩展1：zhy每个字不同颜色，同一行，分别给每个字套span */
        .z{
            color: red;
        }
        .h{
            color: green;
        }
        .y{
            color: yellow;
        }
    </style>
</head>
<body>
    <h2>层叠样式表CSS</h2>
    <div id="box">
        <p>
            CSS<span class="sel-text">选择器</span>
        </p>
        <p>
            <span class="z">z</span><span class="h">h</span><span class="y">y</span>
        </p>
        <p>
            CSS属性
        </p>
    </div>
</body>
</html>
