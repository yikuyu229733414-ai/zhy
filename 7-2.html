    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        ul{
            list-style:none;
            width: 100%;
        }
        li {
            display: flex;
            align-items: center;
            width: 100%;
        }
        li img {
            width: 50%;
            display: block;
            object-fit: cover;
        }
        li p {
            width: 50%;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <ul class="title">
        <li><img src="./img/炫狗.jpg" alt="炫狗"><p>炫狗</p></li>
        <li><img src="./img/炫狗1.jpg" alt="炫狗1"><p>炫狗1</p></li>
        <li><img src="./img/炫狗2.jpg" alt="炫狗2"><p>炫狗2</p></li>
    </ul>
</body>
</html>
