<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-3</title>
    <style>
        html{
            /* rem基准 */
            font-size: 16px;
        }
        .full-box{
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            color: white;
        }
        /* 媒体查询：不同视口宽度，背景色 + html基准字体(rem跟着变) */
        @media (max-width: 600px) {
            .full-box{
                background-color: #112255;
            }
            html{
                font-size: 14px;
            }
        }
        @media (min-width:601px) and (max-width:1000px){
            .full-box{
                background-color: #226633;
            }
            html{
                font-size: 18px;
            }
        }
        @media (min-width:1001px){
            .full-box{
                background-color: #772222;
            }
            html{
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="full-box">袁磊</div>
</body>
</html>
