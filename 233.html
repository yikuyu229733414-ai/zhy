<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Flex布局演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            padding: 40px;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 32px;
        }
        .container {
            display: flex;
            gap: 30px;
            justify-content: center;
        }
        .box {
            width: 200px;
            height: 200px;
            border: 1px solid #333;
            display: flex;
            padding: 10px;
        }
        /* 第1个：居中1个方块 */
        .box1 {
            justify-content: center;
            align-items: center;
        }
        .item {
            width: 60px;
            height: 60px;
            border: 1px solid #333;
            background-color: #cccccc;
        }
        /* 第2个：垂直排列2个 */
        .box2 {
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }
        .item2 {
            width: 80px;
            height: 50px;
            border: 1px solid #333;
            background-color: #cccccc;
        }
        /* 第3个：2行2列4个 */
        .box3 {
            flex-wrap: wrap;
            justify-content: space-between;
            align-content: space-around;
        }
        .item3 {
            width: 80px;
            height: 50px;
            border: 1px solid #333;
            background-color: #cccccc;
        }
        /* 第4个：第一行1个，第二行2个 */
        .box4 {
            flex-direction: column;
            justify-content: space-around;
        }
        .row-top {
            border: 1px solid #333;
            height: 50px;
            background-color: #cccccc;
        }
        .row-bottom {
            display: flex;
            justify-content: space-between;
            gap:10px;
        }
        .item4 {
            width: 80px;
            height: 50px;
            border: 1px solid #333;
            background-color: #cccccc;
        }
    </style>
</head>
<body>
    <h1>Flex布局演示</h1>
    <div class="container">
        <!-- 第一个盒子 -->
        <div class="box box1">
            <div class="item"></div>
        </div>
        <!-- 第二个盒子 -->
        <div class="box box2">
            <div class="item2"></div>
            <div class="item2"></div>
        </div>
        <!-- 第三个盒子 -->
        <div class="box box3">
            <div class="item3"></div>
            <div class="item3"></div>
            <div class="item3"></div>
            <div class="item3"></div>
        </div>
        <!-- 第四个盒子 -->
        <div class="box box4">
            <div class="row-top"></div>
            <div class="row-bottom">
                <div class="item4"></div>
                <div class="item4"></div>
            </div>
        </div>
    </div>
</body>
</html>
