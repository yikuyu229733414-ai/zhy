<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zhy · 炫狗幻灯片</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
            --ink: #17302d;
            --muted: #73827d;
            --paper: #edf1e9;
            --accent: #c8583c;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 18px;
            background:
                radial-gradient(ellipse at 12% 12%, rgb(201 216 189 / 55%), transparent 38%),
                var(--paper);
            color: var(--ink);
            font-family: "Microsoft YaHei", sans-serif;
        }

        main {
            width: min(880px, 100%);
        }

        .slideshow {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 11;
            overflow: hidden;
            border-radius: 8px;
            background: #17211f;
            box-shadow: 0 24px 64px rgb(24 48 43 / 18%);
        }

        .slides-track {
            display: flex;
            width: 400%;
            height: 100%;
            animation: slide-track 12s ease-in-out infinite;
        }

        .slide {
            position: relative;
            flex: 0 0 25%;
            min-width: 0;
            height: 100%;
            display: grid;
            grid-template-rows: minmax(0, 1fr);
        }

        .slide img {
            width: 100%;
            height: 100%;
            min-height: 0;
            object-fit: contain;
        }

        .caption {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 24px 20px;
            background: rgb(0 0 0 / 62%);
            color: #fff;
        }

        .caption strong {
            color: #fff;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 500;
        }

        .caption span {
            color: rgb(255 255 255 / 78%);
            font-size: 0.8rem;
        }

        @keyframes slide-track {
            0%, 22% { transform: translateX(0); }
            25%, 47% { transform: translateX(-25%); }
            50%, 72% { transform: translateX(-50%); }
            75%, 97% { transform: translateX(-75%); }
            100% { transform: translateX(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .slides-track {
                animation: none;
            }
        }

        @media (max-width: 520px) {
            .slideshow {
                aspect-ratio: 4 / 5;
            }

            .caption {
                padding: 14px 16px 16px;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="slideshow" aria-label="zhy 炫狗图片幻灯片">
            <div class="slides-track">
                <article class="slide">
                    <img src="img/炫狗.jpg" alt="炫狗照片 1">
                    <div class="caption"><strong>zhy</strong><span>炫狗影像 · 01</span></div>
                </article>
                <article class="slide">
                    <img src="img/炫狗1.jpg" alt="炫狗照片 2">
                    <div class="caption"><strong>zhy</strong><span>炫狗影像 · 02</span></div>
                </article>
                <article class="slide">
                    <img src="img/炫狗2.jpg" alt="炫狗照片 3">
                    <div class="caption"><strong>zhy</strong><span>炫狗影像 · 03</span></div>
                </article>
                <article class="slide" aria-hidden="true">
                    <img src="img/炫狗.jpg" alt="">
                    <div class="caption"><strong>zhy</strong><span>炫狗影像 · 01</span></div>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
