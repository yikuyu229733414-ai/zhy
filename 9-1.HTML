<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zhy 24001010302 图片卡片</title>
    <style>
        *{margin:0;padding:0;box-sizing: border-box;}
        html,body{height:100%;}
        body{
            padding:10px;
            font-family:"Microsoft YaHei",Arial,sans-serif;
        }
        h2{
            text-align:center;
            height:36px;
            line-height:36px;
        }
        ul{list-style:none;}

        .list{
            display:flex;
            flex-wrap:wrap;
            /* 占满除标题外的剩余高度 */
            height:calc(100vh - 56px);
        }
        .list li{
            width:31.33%;
            /* 3行均分高度，减去上下margin */
            height:calc(33.333% - 8px);
            margin:0.5%;
            overflow:hidden;
            position:relative;
            border-radius:6px;
        }
        .list li img{
            display:block;
            width:100%;
            height:100%;
            /* 关键：填满容器，不变形 */
            object-fit:cover;
            transition:transform 0.5s ease-in-out;
        }

        /* 遮罩文字 */
        .text{
            position:absolute;
            bottom:0;left:0;
            width:100%;height:100%;
            background:rgba(0,0,0,.5);
            color:#fff;
            opacity:0;
            transition:opacity 0.5s ease-in-out;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
        }
        .text h3{margin-bottom:6px;font-size:18px;}
        .text p{font-size:13px;padding:0 10px;text-align:center;}

        /* hover：图片放大 + 文字淡入 */
        .list li:hover img{transform:scale(1.1);}
        .list li:hover .text{opacity:1;}
    </style>
</head>
<body>
    <h2>zhy 24001010302</h2>
    <ul class="list">
        <li><img src="img/炫狗.jpg" alt=""><div class="text"><h3>302</h3><p>第一张图片介绍</p></div></li>
        <li><img src="img/炫狗1.jpg" alt=""><div class="text"><h3>302</h3><p>第二张图片介绍</p></div></li>
        <li><img src="img/炫狗2.jpg" alt=""><div class="text"><h3>302</h3><p>第三张图片介绍</p></div></li>
        <li><img src="img/炫狗.jpg" alt=""><div class="text"><h3>302</h3><p>第四张图片介绍</p></div></li>
        <li><img src="img/炫狗1.jpg" alt=""><div class="text"><h3>302</h3><p>第五张图片介绍</p></div></li>
        <li><img src="img/炫狗2.jpg" alt=""><div class="text"><h3>302</h3><p>第六张图片介绍</p></div></li>
        <li><img src="img/炫狗.jpg" alt=""><div class="text"><h3>302</h3><p>第七张图片介绍</p></div></li>
        <li><img src="img/炫狗1.jpg" alt=""><div class="text"><h3>302</h3><p>第八张图片介绍</p></div></li>
        <li><img src="img/炫狗2.jpg" alt=""><div class="text"><h3>302</h3><p>第九张图片介绍</p></div></li>
    </ul>
</body>
</html>
