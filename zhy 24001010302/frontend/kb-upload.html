<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理 · 知乎模仿</title>
    <!-- 姓名：张浩扬 | 学号：24001010302 | 时间：2026-11-12 | 大模型：DeepSeek-V4-Pro 正式版 -->
    <link rel="stylesheet" href="./css/yuan_kb.css">
</head>
<body>
    <!-- 顶部导航条 -->
    <header class="yuan_topbar">
        <div class="yuan_topbar-inner">
            <a class="yuan_logo" href="./index.html">知乎<span class="yuan_logo-sub">模仿</span></a>
            <nav class="yuan_topnav">
                <a href="./index.html">首页</a>
                <a href="./database.html">数据库测试</a>
                <a href="./chat.html">AI 聊天</a>
                <a class="yuan_topnav-on" href="./kb-upload.html">知识库管理</a>
                <a href="./kb-chat.html">智能客服</a>
            </nav>
        </div>
    </header>

    <main class="yuan_wrap">
        <section class="yuan_kb-panel">
            <div class="yuan_kb-head">
                <h1 class="yuan_kb-title">知识库管理（RAG）</h1>
                <p class="yuan_kb-sub">上传本地 PDF / TXT 文件，后端自动解析并分块存入知识库，构建专属自动客服问答系统。上传与列表结果均输出到浏览器控制台。</p>
            </div>
            <div class="yuan_kb-body">
                <!-- 上传区 -->
                <div class="yuan_upload-zone" id="yuan_uploadZone">
                    <p class="yuan_upload-hint">点击选择或拖拽文件到此处上传</p>
                    <p class="yuan_upload-sub">支持 .txt / .pdf，单个文件不超过 20MB</p>
                    <div class="yuan_upload-filename" id="yuan_uploadFilename"></div>
                </div>
                <input type="file" id="yuan_fileInput" accept=".txt,.pdf" style="display:none;">
                <button class="yuan_btn" id="yuan_uploadBtn" type="button" disabled>上传到知识库</button>

                <!-- 提示消息 -->
                <div class="yuan_msgbox" id="yuan_msgBox"></div>

                <!-- 文件列表 -->
                <h3 style="margin:28px 0 12px;font-size:18px;">已上传文件</h3>
                <div id="yuan_listBox"></div>
            </div>
        </section>
    </main>

    <footer class="yuan_footer">学号：24001010302 · 姓名：张浩扬 · 知识库管理（RAG）</footer>

    <script src="./js/yuan_kb_upload.js"></script>
</body>
</html>
